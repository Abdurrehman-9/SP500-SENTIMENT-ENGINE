name: Daily S&P 500 Market Data Update

on:
  schedule:
    # Run Monday-Friday at 22:00 UTC (5:00 PM EST / 6:00 PM EDT), post-US market close
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline execution mode (daily or verify)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - verify

permissions:
  contents: write

concurrency:
  group: sp500-daily-update
  cancel-in-progress: false

jobs:
  update-market-data:
    # Uses windows-latest so curl.exe and Microsoft ODBC Driver 18 for SQL Server
    # match the Windows pipeline runtime (or switch to [self-hosted, windows] for local SQL Server).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SP500_SQL_Pipeline
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'SP500_SQL_Pipeline/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas

      - name: Verify SQL Server ODBC Driver 18
        run: |
          python -c "import pyodbc; drivers = pyodbc.drivers(); print('ODBC Drivers:', drivers); assert any('ODBC Driver 18 for SQL Server' in d for d in drivers), 'ODBC Driver 18 for SQL Server is missing'"

      - name: Configure runtime authentication from GitHub Secrets
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SQL_SERVER) -or [string]::IsNullOrWhiteSpace($env:SQL_DATABASE)) {
            throw "Required GitHub Secrets SQL_SERVER and SQL_DATABASE must be configured before running the automated pipeline."
          }

          $config = Get-Content -Raw -Path "config.json" | ConvertFrom-Json
          $config.sql_server = $env:SQL_SERVER
          $config.sql_database = $env:SQL_DATABASE
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path "config.runtime.json" -Encoding UTF8
          Copy-Item -Path "config.json" -Destination "config.backup.json" -Force
          Move-Item -Path "config.runtime.json" -Destination "config.json" -Force

      - name: Execute data ingestion and feature engineering pipelines
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: |
          if ($env:MODE -eq 'daily') {
            python pipeline.py daily
            python features.py
          }
          python pipeline.py verify

      - name: Export latest market snapshot for versioned tracking
        run: |
          New-Item -ItemType Directory -Force -Path "data/snapshots" | Out-Null
          python -c @"
          import pandas as pd
          import features
          conn = features.get_connection(features.load_config())
          df = pd.read_sql('SELECT * FROM dbo.DailyMarketMetrics ORDER BY TradingDate ASC', conn)
          df.to_csv('data/snapshots/daily_market_metrics.csv', index=False)
          print(f'Exported {len(df)} rows through {df[\"TradingDate\"].max()}')
          "@

      - name: Restore template config and clean up secrets
        if: always()
        run: |
          if (Test-Path "config.backup.json") {
            Move-Item -Path "config.backup.json" -Destination "config.json" -Force
          }

      - name: Commit and push newly fetched data
        run: |
          Set-Location "${{ github.workspace }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-add only curated snapshot outputs while keeping raw/log directories ignored
          git add -f SP500_SQL_Pipeline/data/snapshots/daily_market_metrics.csv

          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $today = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            git commit -m "chore(data): daily S&P 500 market update ($today) [skip ci]"
            git push
          } else {
            Write-Output "No new market snapshot changes to commit."
          }

